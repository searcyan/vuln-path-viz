<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码执行路径讲解</title>
<!--
  漏洞执行路径讲解页 · 模板
  ────────────────────────────────────────────────────────────────
  × 只改 SCENES 那一段（SCENES:BEGIN ~ SCENES:END），引擎部分不用动。
  × 交付物 = 单个 HTML 文件，无外链、无构建、无网络请求，双击即开。
  × 数据契约见 references/data-model.md；视觉语义见 references/style.md。
-->
<style>
  :root{
    --bg:#0b0e14; --panel:#0f141d; --card:#151a25; --line:#2a3342; --line2:#1b222e;
    --txt:#e7ebf2; --dim:#8b97ab; --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
    --kw:#c792ea; --str:#a5d6a7; --com:#6b7a90; --fn:#82aaff; --num:#f78c6c;
    --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --info:#60a5fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--txt);font:13.5px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#0e131c;z-index:9;position:relative}
  header h1{margin:0;font-size:14px;font-weight:650;white-space:nowrap}
  header h1 span{color:#93c5fd;font-family:var(--mono)}
  .tools{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .tools button{border:1px solid var(--line);background:#121822;color:#b9c4d6;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .tools button:hover{border-color:#3c4a61;color:#fff}
  .tools .z{min-width:44px;text-align:center;font-family:var(--mono)}
  .app{display:flex;height:calc(100% - 52px)}
  aside{width:392px;flex:0 0 392px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  .side-top{padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
  .prog{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
  .bar{flex:1;height:3px;background:#1e2734;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .25s}
  h2#stepTitle{font-size:15px;margin:10px 0 6px;line-height:1.4}
  #stepText{font-size:12.8px;color:#b7c2d4;margin:0 0 10px;line-height:1.68}
  #stepText b{color:#e8eefc}
  #stepText code{font:11.5px var(--mono);background:#1a2230;padding:1px 4px;border-radius:3px;color:#bfdbfe}
  .focusbox{border:1px solid #26303f;border-radius:7px;background:#101722;padding:7px 9px;margin-bottom:9px}
  .focusbox .lbl{font-size:10.5px;color:#61708a;font-family:var(--mono);margin-bottom:3px;white-space:pre-wrap;line-height:1.55}
  .focusbox .code{font:11px/1.5 var(--mono);color:#9ecbff;white-space:pre;overflow-x:auto;padding-bottom:1px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-bottom:8px}
  .badge.ok{background:#0f2a1b;color:#86efac}
  .badge.bad{background:#3b1418;color:#fca5a5}
  .badge.info{background:#0f2036;color:#93c5fd}
  .badge.warn{background:#3a2a0c;color:#fcd34d}
  .nav2{display:flex;gap:8px}
  .nav2 button{flex:1;padding:7px 0;border-radius:6px;border:1px solid var(--line);background:#131a25;color:#c7d2e2;cursor:pointer;font-size:12.5px}
  .nav2 button:hover{border-color:#3c4a61;color:#fff}
  .nav2 button:disabled{opacity:.35;cursor:default}
  .steps{flex:1;overflow:auto;padding:8px 0 20px}
  .steps .h{font-size:10.5px;color:#5d6b80;padding:6px 16px;letter-spacing:.5px;font-family:var(--mono)}
  .steps a{display:flex;gap:8px;padding:5px 16px;color:#93a0b5;text-decoration:none;font-size:12px;cursor:pointer;border-left:2px solid transparent;line-height:1.4}
  .steps a:hover{background:#141b26;color:#e2e8f0}
  .steps a.on{background:#16202e;color:#dbeafe;border-left-color:#3b82f6}
  .steps a .n{font-family:var(--mono);color:#4d5a70;font-size:10.5px;min-width:16px;padding-top:1px}
  main{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(1200px 600px at 30% -10%, #16203055, transparent 65%),
    linear-gradient(90deg,#0b0e14,#0a0d13)}
  #stage{cursor:grab}
  #stage.drag{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
  #stage.drag #canvas{transition:none}
  svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  .card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 10px 30px #0009;opacity:.42;transition:opacity .3s,border-color .3s,box-shadow .3s}
  .card.active{opacity:1;border-color:#3f5273;box-shadow:0 0 0 1px #4f6b9955,0 16px 40px #000b}
  .card .hd{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line2)}
  .card .fn{font:600 13px/1.2 var(--mono);color:#e9eefb}
  .card .loc{font:10.5px/1.2 var(--mono);color:#6c7a91;margin-left:auto;white-space:nowrap}
  .card .sbadge{font:9.5px/1 var(--mono);padding:2px 5px;border-radius:4px;background:#17233a;color:#8fb8f0;white-space:nowrap}
  .card .reqtag{font:9.5px/1 var(--mono);padding:2px 5px;border-radius:4px;background:#3a2a0c;color:#fcd34d;white-space:nowrap}
  .code{padding:6px 0 8px}
  .row{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:0 12px;height:21px;align-items:center;position:relative}
  .row .no{font:10.5px/1 var(--mono);color:#495568;text-align:right}
  .row .cd{font:12.4px/1.2 var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis;color:#cfd9ea}
  /* 会跳到别的代码块的行：淡蓝竖条 + 蓝色行号 + 行尾 ↗ */
  .row.jump::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;background:#3b82f6aa;border-radius:1px}
  .row.jump .no{color:#84b4f7}
  .row.jump::after{content:"↗";position:absolute;right:6px;top:1px;font-size:10px;color:#5f8fd6;opacity:.75}
  /* 当前步骤的「调用发起行」（在父卡片里，橙色标出） */
  .row.src{background:#241d12}
  .row.src::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;background:#f59e0b;border-radius:1px}
  .row.src .no{color:#f6c177}
  .card.hov{border-color:#5b7bb0;opacity:.9}
  .card.active.hov{border-color:#7aa7e0}
  .row.hit{background:#1b2637}
  .row.hit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#60a5fa}
  .row.hit .cd{color:#eef5ff}
  .row.hit::after{content:"▶";position:absolute;right:6px;top:2px;font-size:9px;color:#60a5fa;opacity:.9}
  .card.term .hd{border-bottom-color:#23303f}
  .card.term{background:#0d1319}
  .card.term .cd{color:#b6f0c6}
  .card.term .row.hit::before{background:#22c55e}
  .card.term .row.hit::after{color:#22c55e}
  .edge-lbl{font:10px/1 var(--mono);fill:#8593a9;opacity:.9}
  .kw{color:var(--kw)} .str{color:var(--str)} .com{color:var(--com);font-style:italic}
  .fnc{color:var(--fn)} .num{color:var(--num)}
  .hint{position:absolute;left:16px;bottom:12px;font-size:11.5px;color:#5f6d83;font-family:var(--mono);pointer-events:none}
  .legend{position:absolute;right:16px;bottom:12px;display:flex;gap:12px;font-size:11px;color:#5f6d83;pointer-events:none}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .tabs{display:flex;gap:6px;margin-left:18px}
  .tab{font:11.5px/1 var(--mono);padding:5px 10px;border-radius:6px;border:1px solid #2a3648;background:#121a26;color:#8fa1bb;cursor:pointer;white-space:nowrap}
  .tab:hover{border-color:#3f5273;color:#cfe0f8}
  .tab.on{background:#1c2a3f;border-color:#4f6b99;color:#e9f1ff}
  .tab b{color:#fca5a5;font-weight:600}
  .tab.on b{color:#fdcaca}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button id="ov">总览</button>
    <button id="zo">−</button><span class="z" id="zl">100%</span><button id="zi">+</button>
  </div>
</header>

<div class="app">
  <aside>
    <div class="side-top">
      <div class="prog"><span id="stepNo">– / –</span><div class="bar"><i id="barFill"></i></div></div>
      <h2 id="stepTitle">①</h2>
      <p id="stepText"></p>
      <div class="focusbox"><div class="lbl" id="focusLbl">当前执行</div><div class="code" id="focusCode"></div></div>
      <div class="badge info" id="stepBadge">说明</div>
      <div class="nav2"><button id="prev">← 上一步</button><button id="next">下一步 →</button></div>
    </div>
    <div class="steps" id="stepList"><div class="h">全部步骤（点击跳转）</div></div>
  </aside>

  <main id="stage">
    <div id="canvas">
      <svg class="links" id="links"></svg>
    </div>
    <div class="hint">拖动平移 · Ctrl+滚轮缩放 · ← → 翻页</div>
    <div class="legend" id="legend"></div>
  </main>
</div>

<script>
/* ==================================================================
   ① 场景数据 —— 只改这一段
   ================================================================== */
/* ==== SCENES:BEGIN ==== */
const SCENES = {

  acme: {
    title: `ACME Reports 2.4.1 · <span>两个条件</span>让普通用户读走 /etc/passwd`,
    paths: { ok: "#22c55e", bad: "#ef4444", warn: "#f59e0b", both: "#5d6b83" },

    cards: [
      { id: "intro", kind: "term", depth: 0, w: 900, fn: "背景：两类接口与 token 的身份", loc: "", lines: [
        { n: "", c: `一条真实请求，沿源码走到底：普通用户的 token 打管理接口。` },
        { n: "", c: `` },
        { n: "", c: `两类接口：` },
        { n: "", c: `  /api/reports    业务接口，任何有效 token 都能用` },
        { n: "", c: `  /admin/config   管理接口，改全局配置 —— 本该只有 admin 能调` },
        { n: "", c: `` },
        { n: "", c: `token 在表里只是一行记录：team_id / role / kind` },
        { n: "", c: `` },
        { n: "", c: `鉴权要回答两个问题：` },
        { n: "", c: `  1) 这把 token 有效吗？       → 查库` },
        { n: "", c: `  2) 这个身份能走这条路由吗？   → 路由白名单` },
      ]},

      { id: "curl", kind: "term", depth: 0, w: 900, fn: "$ 普通用户发出的请求", loc: "", lines: [
        { n: "", c: `curl -X POST http://TARGET:8000/admin/config \\` },
        { n: "", c: `  -H "Authorization: Bearer sk-user-0001" \\` },
        { n: "", c: `  -d '{"env":{"ACME_LOGO_PATH":"/etc/passwd"}}'` },
        { n: "", c: `` },
        { n: "", c: `URL 是管理接口，token 是普通用户，body 想把进程环境里的` },
        { n: "", c: `ACME_LOGO_PATH 指到 /etc/passwd。` },
      ]},

      { id: "admin", depth: 0, fn: "update_admin_config()", loc: "src/acme/routes/admin.py:23",
        src: "src/acme/routes/admin.py", lines: [
        { n: 17, c: `# ---- 管理接口：本该只有 admin 能调 ----` },
        { n: 18, c: `@router.post(` },
        { n: 19, c: `    "/admin/config",` },
        { n: 21, c: `    dependencies=[Depends(require_session)],` },
        { n: 22, c: `)` },
        { n: 23, c: `async def update_admin_config(request: Request) -> dict[str, Any]:` },
        { n: 25, c: `    body = await request.json()` },
        { n: 27, c: `    for key, value in (body.get("env") or {}).items():` },
        { n: 28, c: `        set_env(key.upper(), value)` },
        { n: 30, c: `    cfg = await load_config()` },
        { n: 32, c: `    await save_config(cfg)` },
        { n: 34, c: `    return {"ok": True}` },
      ]},

      { id: "deps", depth: 1, fn: "require_session()", loc: "src/acme/auth/deps.py:17",
        src: "src/acme/auth/deps.py", lines: [
        { n: 17, c: `async def require_session(` },
        { n: 18, c: `    request: Request,` },
        { n: 19, c: `    raw_key: str = Security(api_key_header),` },
        { n: 20, c: `) -> "Token":` },
        { n: 22, c: `    key = _strip_bearer(raw_key or "")` },
        { n: 23, c: `    token = await lookup_token(key)` },
        { n: 25, c: `    if token is None:` },
        { n: 26, c: `        raise HTTPException(401, "invalid token")` },
        { n: 28, c: `    check_route(request.method, request.url.path, token)` },
        { n: 29, c: `    return token` },
      ]},

      { id: "guard", depth: 2, fn: "check_route()", loc: "src/acme/auth/routes_guard.py:13",
        src: "src/acme/auth/routes_guard.py", lines: [
        { n: 13, c: `def check_route(method: str, route: str, token: Token) -> None:` },
        { n: 14, c: `    """路由层的第一道（也是唯一一道）判断。"""` },
        { n: 15, c: `    if token.kind == "ui" and route.startswith(UI_PREFIXES):` },
        { n: 16, c: `        # Admin UI 的会话 token 走前缀捷径` },
        { n: 17, c: `        return` },
        { n: 19, c: `    allowed = ROUTE_WHITELIST.get(token.role, [])` },
        { n: 20, c: `    if any(route.startswith(prefix) for prefix in allowed):` },
        { n: 21, c: `        return` },
        { n: 23, c: `    raise_admin_only(route, token)` },
      ]},

      { id: "raise", depth: 3, fn: "raise_admin_only()", loc: "src/acme/auth/models.py:18",
        src: "src/acme/auth/models.py", lines: [
        { n: 18, c: `def raise_admin_only(route: str, token: Token) -> None:` },
        { n: 19, c: `    """非管理员走了管理路由。"""` },
        { n: 20, c: `    raise HTTPException(` },
        { n: 21, c: `        403,` },
        { n: 22, c: `        f"admin only: route={route} role={token.role}",` },
        { n: 23, c: `    )` },
      ]},

      { id: "resp", kind: "term", depth: 4, w: 720, fn: "普通用户看到的响应", loc: "", lines: [
        { n: "", c: `HTTP/1.1 403 Forbidden` },
        { n: "", c: `{` },
        { n: "", c: `  "detail": "admin only: route=/admin/config role=user"` },
        { n: "", c: `}` },
        { n: "", c: `` },
        { n: "", c: `请求倒在守卫里，update_admin_config 的` },
        { n: "", c: `函数体一行都没跑。` },
      ]},

      { id: "config", depth: 1, fn: "set_env()", loc: "src/acme/config_store.py:12",
        src: "src/acme/config_store.py", lines: [
        { n: 12, c: `def set_env(key: str, value: str) -> None:` },
        { n: 13, c: `    """写进进程环境 —— 供各处 os.getenv 读取。"""` },
        { n: 14, c: `    os.environ[key] = value` },
      ]},

      { id: "files", depth: 2, tag: "第二个请求", fn: "serve_logo()", loc: "src/acme/files.py:12",
        src: "src/acme/files.py", lines: [
        { n: 12, c: `@router.get("/logo")` },
        { n: 13, c: `async def serve_logo() -> FileResponse:` },
        { n: 14, c: `    """浏览器取 logo —— 没有任何鉴权。"""` },
        { n: 15, c: `    path = Path(os.getenv("ACME_LOGO_PATH", "static/logo.png"))` },
        { n: 17, c: `    if not path.exists():` },
        { n: 18, c: `        path = Path("static/logo.png")` },
        { n: 20, c: `    return FileResponse(path, media_type="image/png")` },
      ]},

      { id: "summary", kind: "term", depth: 2, w: 780, fn: "复盘：两个条件，缺一不可", loc: "", lines: [
        { n: "", c: `1. 路由层留了前缀捷径：kind="ui" 的 token` },
        { n: "", c: `   "/admin/config".startswith(("/admin","/config")) → 直接 return` },
        { n: "", c: `2. handler 里没有第二道检查：update_admin_config() 从不问 role` },
        { n: "", c: `3. 落点：set_env 把值写进 os.environ，/logo 再原样读出来` },
        { n: "", c: `4. 修复 = 补 2（handler 里加 role 判断），` },
        { n: "", c: `   或把 1 的捷径从"前缀匹配"改成"精确路由 + 明确角色"` },
      ]},
    ],

    edges: [
      { from: "intro", at: null, to: "curl",  path: "both", dashed: true, label: "背景" },
      { from: "curl",  at: null, to: "admin", path: "both", dashed: true, label: "HTTP" },
      { from: "admin", at: 21,   to: "deps",  path: "both" },
      { from: "deps",  at: 28,   to: "guard", path: "both" },
      { from: "guard", at: 23,   to: "raise", path: "bad" },
      { from: "raise", at: 20,   to: "resp",  path: "bad", dashed: true, label: "响应" },
      { from: "admin", at: 28,   to: "config", path: "ok" },
    ],

    steps: [
      { card: "intro", line: null, badge: ["info", "起点"],
        title: "⓪ 先把角色讲清楚",
        text: `ACME 有两类接口：<b>业务接口</b>（<code>/api/reports</code>，任何有效 token 都能用）和<b>管理接口</b>（<code>/admin/config</code>，改全局配置，本该只有 admin 能调）。<br><br>token 在表里只是一行记录：<code>team_id</code>、<code>role</code>、<code>kind</code>。鉴权只回答两个问题：<b>有效吗</b>（查库）和<b>能走这条路由吗</b>（白名单）。<br><br>攻击者手里的是一把普通用户 token。` },

      { card: "curl", line: null, via: { card: "intro", text: "先看背景：两类接口与 token 的身份" }, badge: ["info", "起点"],
        title: "① 一条真实发出去的请求",
        text: `管理接口的 URL，普通用户的 Bearer token，body 想把 <code>ACME_LOGO_PATH</code> 指到 <code>/etc/passwd</code>。<br><br>为什么要挑这个字段？因为 <code>set_env()</code> 会把它写进进程环境，而 <code>/logo</code> 会原样读出来 —— 第 ⑬ 步见。` },

      { card: "admin", line: 21, via: { card: "curl", text: "curl 发出的 HTTP 请求" }, badge: ["warn", "关键"],
        title: "② 装饰器上只写了「验 token」",
        text: `路由挂的是 <code>dependencies=[Depends(require_session)]</code>，意思是「先验 token」。<br><br><b>这里没有任何「必须是 admin」的声明。</b>所以能不能进函数体，全看下一层的判断。` },

      { card: "deps", line: 23, via: { card: "admin", line: 21 }, badge: ["info", "查库"],
        title: "③ 查库：这把 token 是谁",
        text: `剥掉 <code>Bearer</code> 前缀，用 key 查出记录：<code>role="user"</code>、<code>kind="api"</code>。<br><br>这一步只回答「有效吗」，不回答「能不能改配置」。` },

      { card: "guard", line: 15, via: { card: "deps", line: 28 }, badge: ["warn", "分叉点"],
        title: "④ 一行代码决定能否进门",
        text: `<code>kind == "ui"</code> 为假 → <code>and</code> 短路 → 落到白名单。<br><br>记住这一行：它是全篇唯一的分叉点。换成 <code>kind="ui"</code> 的 token，同一个请求就有完全不同的命。` },

      { card: "guard", line: 20, badge: ["bad", "拒绝"],
        title: "⑤ 白名单里没有 /admin/config",
        text: `<code>role="user"</code> 的白名单只有 <code>/api/reports</code> 与 <code>/api/me</code>，前缀都不匹配，于是往下抛。` },

      { card: "raise", line: 20, via: { card: "guard", line: 23 }, badge: ["bad", "抛出"],
        title: "⑥ 403：请求死在守卫里",
        text: `抛 <code>HTTPException(403)</code>，message 里带着 <code>route=</code> 与 <code>role=</code>。<br><br>注意此刻 <code>update_admin_config</code> 的函数体<b>一行都没跑</b>。` },

/* ==================================================================
   ② 引擎 —— 不用改
   ================================================================== */
const CARD_W = 700, COL_W = 1180, GAP = 56, HEAD = 54, LINE_H = 21, PAD = 10;
const DEFAULT_PATHS = { ok:"#22c55e", bad:"#ef4444", warn:"#f59e0b", both:"#5d6b83" };
const CIRCLE = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟";

let CARDS = [], EDGES = [], STEPS = [], byId = {}, COLORS = {...DEFAULT_PATHS};
let CANVAS_W = 0, CANVAS_H = 0;
let SCENE_KEY = Object.keys(SCENES)[0];

const canvas = document.getElementById("canvas");
const stage = document.getElementById("stage");
const svg = document.getElementById("links");
const stepList = document.getElementById("stepList");

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const RE = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(async|await|def|return|if|elif|else|for|in|not|and|or|is|None|True|False|raise|try|except|pass|import|from|class|with|as|lambda|global|yield|while|break|continue)\b|\b(\d+)\b|\b([A-Za-z_]\w*)(?=\()/g;
function hl(s){
  let out = "", last = 0, m;
  RE.lastIndex = 0;
  while ((m = RE.exec(s))){
    out += esc(s.slice(last, m.index));
    if (m[1]) out += `<span class="com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="kw">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="num">${esc(m[4])}</span>`;
    else if (m[5]) out += `<span class="fnc">${esc(m[5])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* ---------- 数据自检：作者写错就打在控制台，不静默 ---------- */
function validateScene(key, sc){
  const bad = [];
  const have = new Set(sc.cards.map(c => c.id));
  if (have.size !== sc.cards.length) bad.push("卡片 id 重复");
  if (!sc.cards.length) bad.push("没有卡片");
  if (!sc.steps.length) bad.push("没有步骤");
  for (const c of sc.cards){
    if (!c.fn) bad.push(`卡片 ${c.id} 缺 fn`);
    if (!Array.isArray(c.lines) || !c.lines.length) bad.push(`卡片 ${c.id} 没有 lines`);
    const ns = c.lines.map(l => l.n).filter(n => n !== "");
    if (new Set(ns).size !== ns.length) bad.push(`卡片 ${c.id} 行号重复`);
  }
  for (const e of sc.edges){
    if (!have.has(e.from) || !have.has(e.to)) bad.push(`边 ${e.from}→${e.to} 指向不存在的卡片`);
    if (!(e.path in COLORS)) bad.push(`边 ${e.from}@${e.at} 的 path="${e.path}" 不在 paths 里`);
    if (e.at != null){
      const a = sc.cards.find(c => c.id === e.from);
      if (!a || !a.lines.some(l => l.n === e.at)) bad.push(`边 ${e.from}@${e.at} 的行号在该卡片里不存在`);
    }
  }
  const zeroBased = [...(sc.steps[0]?.title || "")][0] === "⓪";
  sc.steps.forEach((s, i) => {
    const c = sc.cards.find(x => x.id === s.card);
    if (!c) return bad.push(`第 ${i + 1} 步指向不存在的卡片 ${s.card}`);
    if (s.line != null && !c.lines.some(l => l.n === s.line)) bad.push(`第 ${i + 1} 步行号 ${s.line} 不在 ${s.card} 里`);
    if (s.via){
      const v = sc.cards.find(x => x.id === s.via.card);
      if (!v) bad.push(`第 ${i + 1} 步 via 指向不存在的卡片 ${s.via.card}`);
      else if (s.via.line != null && !v.lines.some(l => l.n === s.via.line)) bad.push(`第 ${i + 1} 步 via 行号 ${s.via.line} 不在 ${s.via.card} 里`);
    }
    if (!Array.isArray(s.badge) || s.badge.length !== 2) bad.push(`第 ${i + 1} 步 badge 应为 [类型, 文字]`);
    const mark = [...(s.title || "")][0];
    if (mark !== "⓪" && CIRCLE.includes(mark)){
      const want = zeroBased ? i - 1 : i;
      if (CIRCLE.indexOf(mark) !== want) bad.push(`第 ${i + 1} 步序号是「${mark}」，与位置不符`);
    }
  });
  if (bad.length){
    console.warn(`[${key}] 场景数据有 ${bad.length} 处问题：\n` + bad.map(b => "  · " + b).join("\n"));
  }
  return bad;
}

/* ---------- 构建 ---------- */
function buildScene(scene){
  CARDS = scene.cards; EDGES = scene.edges; STEPS = scene.steps;
  COLORS = { ...DEFAULT_PATHS, ...(scene.paths || {}) };
  byId = {}; CARDS.forEach(c => byId[c.id] = c);
  canvas.querySelectorAll(".card").forEach(el => el.remove());
  svg.innerHTML = "";
  stepList.innerHTML = '<div class="h">全部步骤（点击跳转）</div>';

  /* 布局：只算宽度与列坐标；高度等卡片渲染后用真实 DOM 高度回填 */
  let maxDepth = 0;
  const dspLen = s => {
    let n = 0;
    for (const ch of String(s)) n += /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]/.test(ch) ? 2 : 1;
    return n;
  };
  for (const c of CARDS){
    const maxLen = Math.max(...c.lines.map(l => dspLen(l.c)));
    c.w = c.w || Math.min(920, Math.max(700, 78 + maxLen * 7.3));
    c.x = c.depth * COL_W;
    maxDepth = Math.max(maxDepth, c.depth);
  }

  /* 连线两端都用真实 DOM 位置测量，避免字号/内边距估算造成的偏移 */
  const rowCenterY = (c, n) => {
    const row = c.el && c.el.querySelector(`.row[data-line="${n}"]`);
    return row ? c.y + row.offsetTop + row.offsetHeight / 2 : c.y + c.h / 2;
  };
  const headLineY = c => {
    const first = c.el && c.el.querySelector(".row");
    return first ? c.y + first.offsetTop + first.offsetHeight / 2 : c.y + c.h / 2;
  };

  const makeMarkers = () => {
    const defs = document.createElementNS("http://www.w3.org/2000/svg","defs");
    defs.id = "arrows";
    for (const [key, col] of Object.entries(COLORS)){
      const m = document.createElementNS("http://www.w3.org/2000/svg","marker");
      m.setAttribute("id", "arr-" + key);
      m.setAttribute("viewBox","0 0 10 10");
      m.setAttribute("refX","9"); m.setAttribute("refY","5");
      m.setAttribute("markerWidth","7"); m.setAttribute("markerHeight","7");
      m.setAttribute("orient","auto-start-reverse");
      const mp = document.createElementNS("http://www.w3.org/2000/svg","path");
      mp.setAttribute("d","M 0 1 L 9 5 L 0 9 z");
      mp.setAttribute("fill", col);
      m.appendChild(mp); defs.appendChild(m);
    }
    svg.appendChild(defs);
  };

  const drawEdges = () => {
    /* 同一个父卡片的出线分配不同「车道」，让曲线并排不重叠 */
    const groups = {};
    EDGES.forEach((e, i) => { (groups[e.from] = groups[e.from] || []).push(i); });
    const laneOf = {};
    Object.values(groups).forEach(list => list.forEach((ei, k) => { laneOf[ei] = 24 + k * 28; }));

    EDGES.forEach((e, i) => {
      const a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      const col = COLORS[e.path];
      const y2 = headLineY(b);
      let d, x1, y1, x2;

      if (a.x === b.x){
        /* 同列（例如 curl → handler）：走垂直虚线 */
        const cx = a.x + a.w / 2;
        x1 = cx; y1 = a.y + a.h; x2 = cx;
        d = `M ${cx} ${y1} L ${cx} ${b.y - 4}`;
      } else {
        const lane = laneOf[i];
        x1 = a.x + a.w + lane;
        y1 = rowCenterY(a, e.at);
        x2 = b.x - 3;
        d = `M ${a.x + a.w} ${y1} H ${x1} ` +
            `C ${x1 + 60} ${y1}, ${x2 - 80} ${y2}, ${x2} ${y2}`;
      }

      const p = document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d", d);
      p.setAttribute("fill","none");
      p.setAttribute("stroke", col);
      p.setAttribute("stroke-width","1.7");
      p.setAttribute("opacity","0.35");
      p.setAttribute("marker-end", `url(#arr-${e.path})`);
      if (e.dashed) p.setAttribute("stroke-dasharray","6 5");
      p.dataset.from = e.from; p.dataset.to = e.to;
      svg.appendChild(p);

      const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
      dot.setAttribute("cx", x1); dot.setAttribute("cy", y1); dot.setAttribute("r","3");
      dot.setAttribute("fill", col); dot.setAttribute("opacity","0.75");
      svg.appendChild(dot);

      const lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
      const sameCol = (a.x === b.x);
      lbl.setAttribute("x", sameCol ? x1 + 8 : x1 + 7);
      lbl.setAttribute("y", sameCol ? y1 + 16 : y1 - 5);
      lbl.setAttribute("class", "edge-lbl");
      lbl.textContent = e.label ? e.label : String(e.at);
      svg.appendChild(lbl);
    });
  };

  /* 哪些行会跳转：from@line → 目标卡片 */
  const JUMP = {};
  EDGES.forEach(e => { JUMP[e.from + "@" + e.at] = e.to; });

  /* 每张卡片对应哪些步骤（头部徽标 + 点击循环） */
  const CARD_STEPS = {};
  STEPS.forEach((s, i) => { (CARD_STEPS[s.card] = CARD_STEPS[s.card] || []).push(i); });

  for (const c of CARDS){
    const el = document.createElement("div");
    el.className = "card" + (c.kind === "term" ? " term" : "");
    el.style.left = c.x + "px"; el.style.top = "0px"; el.style.width = c.w + "px";
    el.dataset.id = c.id;
    c.el = el;

    const hd = document.createElement("div");
    hd.className = "hd";
    const slist = CARD_STEPS[c.id] || [];
    const sb = slist.length
      ? `<span class="sbadge" title="点击卡片可在该代码块的 ${slist.length} 个步骤之间切换">第 ${slist[0] + 1}${slist.length > 1 ? "…" + (slist[slist.length - 1] + 1) : ""} 步 · ${slist.length} 处</span>`
      : "";
    const reqtag = c.tag ? `<span class="reqtag">${esc(c.tag)}</span>` : "";
    hd.innerHTML = `<span class="fn">${esc(c.fn)}</span>` + reqtag + sb +
                   (c.loc ? `<span class="loc">${esc(c.loc)}</span>` : "");
    el.appendChild(hd);

    const code = document.createElement("div");
    code.className = "code";
    c.lines.forEach(l => {
      const row = document.createElement("div");
      const target = JUMP[c.id + "@" + l.n];
      row.className = "row" + (target ? " jump" : "");
      row.dataset.line = l.n === "" ? "" : String(l.n);
      if (target){
        const t = byId[target];
        row.title = `${l.n} 行 → 调用 ${t.fn}（${t.loc}）`;
      }
      row.innerHTML = `<span class="no">${l.n === "" ? "" : l.n}</span><span class="cd">${hl(l.c)}</span>`;
      code.appendChild(row);
    });
    el.appendChild(code);

    /* 点代码块：在该卡的多个步骤之间循环；若不是主角，跳到「以它为调用方」的那一步 */
    el.addEventListener("click", () => {
      if (dragMoved) return;
      const list = CARD_STEPS[c.id] || [];
      if (list.length){
        const pos = list.indexOf(cur);
        const next = pos >= 0 ? list[(pos + 1) % list.length] : list[0];
        if (next !== cur) go(next);
        return;
      }
      const viaIdx = STEPS.findIndex(s => s.via && s.via.card === c.id);
      if (viaIdx >= 0 && viaIdx !== cur) go(viaIdx);
    });
    el.addEventListener("mouseenter", () => { if (!dragMoved) el.classList.add("hov"); });
    el.addEventListener("mouseleave", () => el.classList.remove("hov"));

    canvas.appendChild(el);
  }

  /* 测量真实高度 → 自上而下定位 */
  for (const c of CARDS) c.h = c.el.offsetHeight;
  let yy = 0;
  for (const c of CARDS){ c.y = yy; c.el.style.top = c.y + "px"; yy += c.h + GAP; }
  CANVAS_W = (maxDepth + 1) * COL_W + 60;
  CANVAS_H = yy + 40;
  canvas.style.width = CANVAS_W + "px";
  canvas.style.height = CANVAS_H + "px";
  svg.setAttribute("width", CANVAS_W);
  svg.setAttribute("height", CANVAS_H);
  svg.setAttribute("viewBox", `0 0 ${CANVAS_W} ${CANVAS_H}`);
  makeMarkers();
  drawEdges();

  /* 步骤列表 */
  STEPS.forEach((s, i) => {
    const a = document.createElement("a");
    a.innerHTML = `<span class="n">${String(i + 1).padStart(2,"0")}</span><span>${esc(s.title.replace(/^[①-⑳㉑-㉟]\s*/, ""))}</span>`;
    a.addEventListener("click", () => go(i));
    stepList.appendChild(a);
    s.el = a;
  });
}

/* ---------- 视图：平移 / 缩放 ---------- */
const view = { x: 0, y: 0, z: 1 };
const Z0 = 1;
let userZoom = 1;
const apply = () => { canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`; };

function center(c, z){
  const vw = stage.clientWidth, vh = stage.clientHeight;
  view.z = z;
  const step = STEPS[cur];
  const via = step && step.via ? byId[step.via.card] : null;
  /* 有 via（调用方在左）时把当前卡片放右一点，露出左侧调用方；否则偏左，露出右侧被调方 */
  const ax = via ? 0.62 : 0.30;
  let vx = vw * ax - (c.x + c.w / 2) * z;
  vx = Math.min(vx, vw - 24 - (c.x + c.w) * z);
  vx = Math.max(vx, 24 - c.x * z);
  view.x = vx;

  let vy = vh * 0.48 - (c.y + c.h / 2) * z;
  vy = Math.min(vy, vh - 24 - (c.y + c.h) * z);
  vy = Math.max(vy, 24 - c.y * z);
  view.y = vy;
  apply();
}

function zoomAt(factor, cx, cy){
  const nz = Math.min(1.6, Math.max(0.18, view.z * factor));
  const k = nz / view.z;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  view.z = nz;
  userZoom = nz;
  apply();
  document.getElementById("zl").textContent = Math.round(nz * 100) + "%";
}

/* ---------- 步骤 ---------- */
let cur = -1;
const stepNo = document.getElementById("stepNo");
const stepTitle = document.getElementById("stepTitle");
const stepText = document.getElementById("stepText");
const stepBadge = document.getElementById("stepBadge");
const focusCode = document.getElementById("focusCode");
const focusLbl = document.getElementById("focusLbl");
const barFill = document.getElementById("barFill");

function go(i){
  if (i < 0 || i >= STEPS.length) return;
  cur = i;
  const s = STEPS[i], c = byId[s.card];

  STEPS.forEach((x, j) => x.el.classList.toggle("on", j === i));
  CARDS.forEach(x => x.el.classList.toggle("active", x.id === s.card));
  document.querySelectorAll(".row.hit").forEach(r => r.classList.remove("hit"));
  document.querySelectorAll(".row.src").forEach(r => r.classList.remove("src"));
  if (s.line != null){
    const row = c.el.querySelector(`.row[data-line="${s.line}"]`);
    if (row) row.classList.add("hit");
  }
  /* 调用发起行（父卡片里那一行）用橙色标出 */
  let viaTxt = "";
  if (s.via && byId[s.via.card]){
    const vc = byId[s.via.card];
    const vrow = vc.el.querySelector(`.row[data-line="${s.via.line}"]`);
    if (vrow) vrow.classList.add("src");
    viaTxt = s.via.text
      ? `　←　${s.via.text}`
      : (s.ret
          ? `　←　从 ${vc.fn} 返回（第 ${s.via.line} 行）`
          : `　←　由 ${vc.fn} 第 ${s.via.line} 行调用`);
  }
  svg.querySelectorAll("path").forEach(p => {
    const on = p.dataset.to === s.card || p.dataset.from === s.card;
    p.setAttribute("opacity", on ? "0.9" : "0.18");
  });

  stepTitle.textContent = s.title;
  stepText.innerHTML = s.text;
  stepBadge.className = "badge " + s.badge[0];
  stepBadge.textContent = s.badge[1];
  const locLine = s.line != null ? c.loc.replace(/:\d+$/, ":" + s.line) : c.loc;
  focusLbl.textContent = (s.line != null ? `当前执行：${locLine}` : "当前步骤") + viaTxt;
  const lineObj = s.line != null ? c.lines.find(l => l.n === s.line) : null;
  focusCode.textContent = lineObj ? lineObj.c : (c.kind === "term" ? c.lines[0].c : c.fn + "  —  " + c.loc);

  stepNo.textContent = `${i + 1} / ${STEPS.length}`;
  barFill.style.width = ((i + 1) / STEPS.length * 100) + "%";
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === STEPS.length - 1;

  const ovEl = document.getElementById("ov");
  if (ovEl.dataset.on === "1"){ ovEl.dataset.on = "0"; ovEl.textContent = "总览"; }
  center(c, userZoom);
  document.getElementById("zl").textContent = Math.round(userZoom * 100) + "%";
}

document.getElementById("prev").addEventListener("click", () => go(cur - 1));
document.getElementById("next").addEventListener("click", () => go(cur + 1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); go(cur - 1); }
});

/* ---------- 总览 / 缩放 ---------- */
const ovBtn = document.getElementById("ov");
ovBtn.addEventListener("click", () => {
  if (ovBtn.dataset.on === "1"){
    ovBtn.dataset.on = "0"; ovBtn.textContent = "总览";
    center(byId[STEPS[cur].card], userZoom);
    document.getElementById("zl").textContent = Math.round(userZoom * 100) + "%";
  } else {
    ovBtn.dataset.on = "1"; ovBtn.textContent = "回到当前";
    const z = Math.min(stage.clientWidth / CANVAS_W, stage.clientHeight / CANVAS_H) * 0.94;
    view.z = z;
    view.x = (stage.clientWidth - CANVAS_W * z) / 2;
    view.y = (stage.clientHeight - CANVAS_H * z) / 2;
    apply();
    document.getElementById("zl").textContent = Math.round(z * 100) + "%";
  }
});
document.getElementById("zi").addEventListener("click", () => zoomAt(1.12, stage.clientWidth / 2, stage.clientHeight / 2));
document.getElementById("zo").addEventListener("click", () => zoomAt(1 / 1.12, stage.clientWidth / 2, stage.clientHeight / 2));

stage.addEventListener("wheel", e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY);
}, {passive:false});

/* ---------- 拖动 ---------- */
let drag = null, dragMoved = false;
stage.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  dragMoved = false;
  stage.classList.add("drag");
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) dragMoved = true;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  apply();
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("drag"); });

/* ---------- 初始化 / 场景切换 ---------- */
const SCENE_KEYS = Object.keys(SCENES);

function buildTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  if (SCENE_KEYS.length < 2){ tabs.style.display = "none"; return; }
  SCENE_KEYS.forEach(k => {
    const b = document.createElement("button");
    b.className = "tab" + (k === SCENE_KEY ? " on" : "");
    b.dataset.scene = k;
    b.innerHTML = SCENES[k].tab || SCENES[k].title;
    b.addEventListener("click", () => loadScene(k, 0));
    tabs.appendChild(b);
  });
}

function buildLegend(scene){
  const box = document.getElementById("legend");
  box.innerHTML = "";
  const LABELS = { ok: "通过", bad: "拒绝", warn: "分叉", both: "调用" };
  /* 默认只列「这张图里真的用到的」边语义色，避免图例比图还大 */
  const used = new Set((scene.edges || []).map(e => e.path));
  const entries = scene.legend
    || Object.keys(COLORS).filter(k => k !== "both" && used.has(k)).map(k => [k, LABELS[k] || k]);
  entries.forEach(([k, label]) => {
    const s = document.createElement("span");
    s.innerHTML = `<i style="background:${COLORS[k] || DEFAULT_PATHS[k] || "#888"}"></i>${esc(label)}`;
    box.appendChild(s);
  });
}

function loadScene(key, step){
  if (!SCENES[key]) key = SCENE_KEYS[0];
  SCENE_KEY = key;
  const sc = SCENES[key];
  userZoom = 1;
  document.getElementById("zl").textContent = "100%";
  document.title = (sc.title || "").replace(/<[^>]+>/g, "");
  /* 多场景时页头用 pageTitle（页面级标题），单场景直接用 title */
  document.getElementById("title").innerHTML = sc.pageTitle || sc.title || "";
  COLORS = { ...DEFAULT_PATHS, ...(sc.paths || {}) };
  buildTabs();
  buildLegend(sc);
  validateScene(key, sc);
  buildScene(sc);
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.scene === key));
  const start = Math.max(0, Math.min(sc.steps.length - 1, Number(step) || 0));
  go(start);
  requestAnimationFrame(() => center(byId[STEPS[start].card], Z0));
}

const qs = new URLSearchParams(location.search);
loadScene(qs.get("scene") || SCENE_KEYS[0], qs.get("step") || 0);
</script>
